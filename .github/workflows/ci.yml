name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.20.0

jobs:
  secrets:
    name: Scan repository history for secrets
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified secret scanner
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan all fetched commits
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .'

  verify:
    name: ${{ matrix.name }}
    runs-on: >-
      ${{ matrix.name == 'macOS' && fromJSON('["self-hosted", "macOS", "ARM64", "intrica"]')
        || github.event_name == 'pull_request' && fromJSON('["ubuntu-22.04"]')
        || fromJSON('["self-hosted", "Linux", "X64", "intrica"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Contributor code must not run on persistent runners.
        name: ${{ fromJSON(github.event_name == 'pull_request' && '["Linux"]' || '["Linux", "macOS"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          dest: ${{ runner.temp }}/pnpm

      - name: Install dependencies
        run: pnpm install --store-dir "$RUNNER_TOOL_CACHE/intrica-pnpm-store" --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Functional and integration tests
        run: |
          node --test scripts/check-canvas-snapshot.test.mjs
          node --test scripts/deploy-server.test.mjs scripts/server-prerequisites.test.mjs scripts/install-server.test.mjs scripts/service-sandbox.test.mjs
          node --test tests/integration/public-releases.test.mjs
          node scripts/ci-tests.mjs functional

      # Mutates generated server modules and restores them after each case.
      # Keep this sequential with builds and any tests using the same dist.
      - name: Interaction safety ablation
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: node tests/integration/ablate-interactions.mjs

      - name: Install browser system dependencies
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: pnpm --filter @intrica/tests-e2e exec playwright install-deps chromium

      - name: Install Playwright Chromium
        run: pnpm --filter @intrica/tests-e2e exec playwright install chromium

      - name: Browser E2E
        env:
          INTRICA_E2E_SKIP_BUILD: "1"
          INTRICA_E2E_PREVIEW: "1"
        run: |
          node scripts/ci-tests.mjs browser
          node --test --test-concurrency=1 tests/e2e/desktop-update-layout.test.mjs tests/e2e/input-receipt-layout.test.mjs tests/e2e/file-reference-interactions.test.mjs tests/e2e/settings-ssh.test.mjs tests/e2e/settings-ssh-onboarding.test.mjs

      - name: Prepare Electron icons
        run: pnpm --filter @intrica/desktop run icons

      - name: Desktop connection and update modules
        run: node --test apps/desktop/connections.test.mjs apps/desktop/ssh.test.mjs apps/desktop/ssh-operations.test.mjs apps/desktop/updates.test.mjs apps/desktop/update-installer.test.mjs apps/desktop/files.test.mjs

      - name: Electron E2E on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run --auto-servernum --server-args='-screen 0 1440x960x24' pnpm --filter @intrica/desktop exec node --test --test-reporter=tap --test-concurrency=1 test.mjs standalone.test.mjs remote.test.mjs

      - name: Electron E2E on macOS
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: pnpm --filter @intrica/desktop exec node --test --test-reporter=tap --test-concurrency=1 test.mjs standalone.test.mjs remote.test.mjs

      - name: Shared client-server matrix on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          INTRICA_MATRIX_REPORT_DIR: tests/e2e/test-results/client-matrix
        run: xvfb-run --auto-servernum --server-args='-screen 0 1440x960x24' pnpm test:matrix

      - name: Shared client-server matrix on macOS
        if: runner.os == 'macOS'
        timeout-minutes: 10
        env:
          INTRICA_MATRIX_REPORT_DIR: tests/e2e/test-results/client-matrix
        run: pnpm test:matrix

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}-test-diagnostics
          path: |
            tests/integration/test-results
            tests/e2e/test-results
            tests/e2e/playwright-report
            apps/desktop/test-results
          if-no-files-found: ignore
